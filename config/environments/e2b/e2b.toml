# E2B Sandbox Configuration for Ericsson RAN Swarm Optimizer
# https://e2b.dev/docs/sandbox-template

[template]
name = "ericsson-ran-swarm"
version = "2.0.0"
description = "Neuro-Federated Swarm Intelligence for Ericsson RAN Optimization"

[sandbox]
# Base configuration
dockerfile = "Dockerfile.e2b"
start_cmd = "npm run start"
timeout = 3600
cpu_count = 4
memory_mb = 8192

# Networking
[[sandbox.ports]]
port = 3000
name = "api"

[[sandbox.ports]]
port = 3001
name = "websocket"

[[sandbox.ports]]
port = 9090
name = "metrics"

[[sandbox.ports]]
port = 8080
name = "health"

# Environment variables (defaults, override with secrets)
[sandbox.env]
NODE_ENV = "production"
PLATFORM = "e2b"
LOG_LEVEL = "info"
CLAUDE_FLOW_ENABLED = "true"
HIVE_MIND_ENABLED = "true"

# File system mounts
[[sandbox.mounts]]
path = "/data"
persistent = true

[[sandbox.mounts]]
path = "/logs"
persistent = false

# Health check
[sandbox.health_check]
path = "/health"
port = 8080
interval_seconds = 30
timeout_seconds = 10
retries = 3
