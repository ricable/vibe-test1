version: '3.9'

services:
  # Main Ericsson RAN Swarm Optimizer
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ericsson-ran-swarm
    ports:
      - "3000:3000"   # API Server
      - "3001:3001"   # WebSocket
      - "3002:3002"   # Dashboard
      - "8080:8080"   # Health Check
    environment:
      - NODE_ENV=production
      - PLATFORM=docker
      - LOG_LEVEL=info
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - E2B_API_KEY=${E2B_API_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CLAUDE_FLOW_ENABLED=true
      - HIVE_MIND_ENABLED=true
      - CM_ENABLED=true
      - PM_ENABLED=true
      - FM_ENABLED=true
      - GNN_ENABLED=true
    volumes:
      - ./config:/app/config:ro
      - ran-data:/app/data
      - ran-logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - swarm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Redis for caching and pub/sub
  redis:
    image: redis:7-alpine
    container_name: swarm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - swarm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    command: redis-server --appendonly yes

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: swarm-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - swarm-network
    restart: unless-stopped

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: swarm-grafana
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - swarm-network
    restart: unless-stopped

  # Vector Database (Optional - for production scale)
  # Uncomment if you need dedicated vector storage
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   container_name: swarm-qdrant
  #   ports:
  #     - "6333:6333"
  #   volumes:
  #     - qdrant-data:/qdrant/storage
  #   networks:
  #     - swarm-network
  #   restart: unless-stopped

volumes:
  ran-data:
    name: ericsson-ran-data
  ran-logs:
    name: ericsson-ran-logs
  redis-data:
    name: ericsson-redis-data
  prometheus-data:
    name: ericsson-prometheus-data
  grafana-data:
    name: ericsson-grafana-data
  # qdrant-data:
  #   name: ericsson-qdrant-data

networks:
  swarm-network:
    name: ericsson-swarm-network
    driver: bridge
